[package]
name = "sakoram_billing"
# The crate ships a second binary (src/bin/mint_license.rs, the license-key
# minting tool). Without default-run, `cargo run` — which `tauri dev` invokes —
# can't pick a binary. Pin the app binary so the tool stays out of the way
# (mint it explicitly via `cargo run --bin mint_license`).
default-run = "sakoram_billing"
version = "0.136.1"
description = "Sakoram — desktop bookkeeper for quotes, invoices, bills and vouchers"
authors = [ "Sakoram" ]
license = "MIT"
edition = "2021"

[lib]
name = "sakoram_billing_lib"
crate-type = [
	"staticlib",
	"cdylib",
	"rlib"
]

[build-dependencies.tauri-build]
version = "2.5.3"
features = []

[dependencies]
tauri-plugin-shell = "2.3.4"
tauri-plugin-notification = "2.3.3"
tauri-plugin-os = "2.3.2"
tauri-plugin-fs = "2.4.5"
tauri-plugin-store = "2.4.2"
tauri-plugin-dialog = "2.7"
# Persists the main window's size / position / maximized state across
# launches (saved on exit, restored on startup). Registered in lib.rs;
# the auto save/restore runs entirely Rust-side so no JS package and no
# capability entry are needed.
tauri-plugin-window-state = "2.4.1"
serde_json = "1"
thiserror = "2"

# Per-business encryption (src/vault.rs): envelope encryption of a business
# database. argon2 derives the password key; chacha20poly1305 provides the
# XChaCha20-Poly1305 AEAD (one-shot for key wrapping, STREAM for the DB file);
# data-encoding gives us base64 (vault JSON) + base32 (recovery key); rand_core
# is the OS CSPRNG.
argon2 = "0.5"
chacha20poly1305 = { version = "0.10", features = [ "stream" ] }
rand_core = { version = "0.6", features = [ "getrandom" ] }
data-encoding = "2"
zeroize = "1"

# License-key signatures (src/license.rs + src/bin/mint_license.rs).
# Ed25519: the app embeds only the public key and verifies offline; only the
# private key (kept off-repo) can mint a valid key.
ed25519-dalek = { version = "2", features = [ "rand_core" ] }

# Trial-reset hardening (src/license.rs): the trial-start date is also written
# to the OS credential store (Windows Credential Manager / macOS Keychain) via
# `keyring`, bound to a stable per-machine id (`machine-uid`). This out-of-band
# marker survives deleting the app-data folder, so the trial can't be re-armed
# by wiping license.json. Best-effort — failures degrade to license.json only.
keyring = { version = "3", features = [
	"apple-native",
	"windows-native"
] }
machine-uid = "0.5"

# Phone-upload feature (src/phone_upload.rs): a small LAN HTTP server so a
# photo taken on the user's phone can be pushed straight onto an invoice.
# axum serves the capture page + multipart upload endpoint; local-ip-address
# resolves this machine's LAN address for the QR; infer content-sniffs the
# uploaded bytes so a forged Content-Type can't smuggle a non-image through.
axum = { version = "0.8", features = [ "multipart" ] }
tokio = { version = "1", features = [
	"net",
	"time",
	"sync",
	"rt"
] }
local-ip-address = "0.6"
infer = "0.16"
uuid = { version = "1", features = [ "v4" ] }

# Used directly by the tenants module to run migrations on per-business DBs
# (tauri-plugin-sql's static add_migrations can't register URLs added at
# runtime, so we run them ourselves via sqlx).
sqlx = { version = "0.8", features = [
	"runtime-tokio",
	"sqlite"
] }

# Used by the data_io module to bundle/extract export archives.
zip = { version = "2", default-features = false, features = [ "deflate" ] }

# Owner-password PDF encryption applied as a post-process after Typst
# renders a document (see src/pdf.rs). `vendored` builds libqpdf from the
# bundled C/C++ source via the `cc` crate — no system libqpdf, no CMake,
# and the crate ships pre-generated bindings for our build targets so no
# libclang/bindgen is needed either.
qpdf = { version = "0.3", features = [ "vendored" ] }

[dependencies.tauri-plugin-sql]
version = "2.4"
features = [ "sqlite" ]

[dependencies.tauri]
version = "2.10"
features = [
	"protocol-asset",
	"unstable"
]

[dependencies.serde]
version = "1"
features = [ "derive" ]

[features]
default = [ "desktop" ]
desktop = [ "tauri/tray-icon" ]
