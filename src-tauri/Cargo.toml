[package]
name = "sakoram_billing"
version = "0.19.0"
description = "Sakoram Book Keeping — desktop app for quotes, invoices, bills and vouchers"
authors = [ "Sakoram" ]
license = "MIT"
edition = "2021"

[lib]
name = "sakoram_billing_lib"
crate-type = [
	"staticlib",
	"cdylib",
	"rlib"
]

[build-dependencies.tauri-build]
version = "2.5.3"
features = []

[dependencies]
tauri-plugin-shell = "2.3.4"
tauri-plugin-notification = "2.3.3"
tauri-plugin-os = "2.3.2"
tauri-plugin-fs = "2.4.5"
tauri-plugin-store = "2.4.2"
tauri-plugin-dialog = "2.7"
serde_json = "1"
thiserror = "2"

# Used directly by the tenants module to run migrations on per-business DBs
# (tauri-plugin-sql's static add_migrations can't register URLs added at
# runtime, so we run them ourselves via sqlx).
sqlx = { version = "0.8", features = [
	"runtime-tokio",
	"sqlite"
] }

# Used by the data_io module to bundle/extract export archives.
zip = { version = "2", default-features = false, features = [ "deflate" ] }

[dependencies.tauri-plugin-sql]
version = "2.4"
features = [ "sqlite" ]

[dependencies.tauri]
version = "2.10"
features = [
	"protocol-asset",
	"unstable"
]

[dependencies.serde]
version = "1"
features = [ "derive" ]

[features]
default = [ "desktop" ]
desktop = [ "tauri/tray-icon" ]
