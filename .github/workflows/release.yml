name: Release

# Two ways to trigger this:
#
# 1. Push a v*.*.* git tag — uses that tag as the release version.
#       git tag -a v0.10.1 -m "..." && git push origin v0.10.1
#
# 2. Manual run from the Actions tab (workflow_dispatch) — derives the
#    version from package.json and creates a matching git tag automatically.
#
# Either way, the release tag is ALWAYS v<package.json version>, so each
# version gets its own release. The job refuses to overwrite a release
# that is already published.
#
# Builds run in parallel for Windows (MSI + NSIS) and macOS (DMG +
# .app.tar.gz, both Apple Silicon and Intel). All artifacts are attached
# to the same draft release.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so we can push a tag back

      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # On tag push: use the pushed tag. Otherwise: read package.json.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          echo "Release tag will be: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # Look up the existing release for this tag, if any. `gh release view`
          # exits non-zero when not found — swallow that.
          if json=$(gh release view "$tag" --json isDraft 2>/dev/null); then
            is_draft=$(echo "$json" | node -p "JSON.parse(require('fs').readFileSync(0)).isDraft")
            if [[ "$is_draft" == "false" ]]; then
              echo "::error::Release $tag is already published. Bump the version in package.json before re-running."
              exit 1
            fi
            echo "Deleting stale draft release $tag so this run starts clean..."
            gh release delete "$tag" --yes --cleanup-tag
          fi

      - name: Create git tag (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          if git ls-remote --tags origin "refs/tags/$tag" | grep -q "$tag"; then
            echo "Tag $tag already exists on remote, skipping creation."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Release $tag"
            git push origin "$tag"
          fi

  build-windows:
    needs: prepare
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: windows

      - name: Install Typst CLI sidecar
        # The Typst binary is not committed (~48 MB). Install it and place it
        # under src-tauri/binaries/ with the target-triple naming Tauri expects.
        shell: pwsh
        run: |
          cargo install --locked typst-cli --root src-tauri/.tools
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item src-tauri/.tools/bin/typst.exe src-tauri/binaries/typst-x86_64-pc-windows-msvc.exe

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri app
        run: bun run tauri:build

      - name: Upload Windows installers to draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe

  build-macos:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: macos-13
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install Typst CLI sidecar
        # Tauri matches sidecars by target-triple suffix; install per-arch
        # and rename so it picks up the right one for this build.
        run: |
          cargo install --locked typst-cli --root src-tauri/.tools
          mkdir -p src-tauri/binaries
          cp src-tauri/.tools/bin/typst "src-tauri/binaries/typst-${{ matrix.target }}"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri app
        run: bun run tauri:build -- --target ${{ matrix.target }}

      - name: Upload macOS bundles to draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
