name: Release · Windows

# Builds Windows installers (MSI + NSIS) for the current package.json
# version and uploads them to a draft release.
#
# Two ways to trigger:
#   1. Push a v*.*.* git tag — uses that tag as the release version.
#         git tag -a v0.72.1 -m "..." && git push origin v0.72.1
#   2. Manual run from the Actions tab (workflow_dispatch) — derives
#      the version from package.json and creates the matching tag.
#
# The macOS build lives in release-macos.yml and runs in parallel on
# tag push. Either can be re-run on its own from the Actions tab —
# Windows artifacts and Mac artifacts upload to the same draft release
# (matched by tag) without stepping on each other.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history so we can push a tag back

      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # On tag push: use the pushed tag. Otherwise: read package.json.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          echo "Release tag will be: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # Refuse to overwrite a published release. The Windows and macOS
          # workflows can race on draft cleanup when both fire on a tag
          # push — that's tolerated below.
          if json=$(gh release view "$tag" --json isDraft 2>/dev/null); then
            is_draft=$(echo "$json" | node -p "JSON.parse(require('fs').readFileSync(0)).isDraft")
            if [[ "$is_draft" == "false" ]]; then
              echo "::error::Release $tag is already published. Bump the version in package.json before re-running."
              exit 1
            fi
          fi

      - name: Create git tag (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          if git ls-remote --tags origin "refs/tags/$tag" | grep -q "$tag"; then
            echo "Tag $tag already exists on remote, skipping creation."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Release $tag"
            git push origin "$tag"
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: windows

      - name: Install Typst CLI sidecar
        # The Typst binary is not committed (~48 MB). Install it and place it
        # under src-tauri/binaries/ with the target-triple naming Tauri expects.
        shell: pwsh
        run: |
          cargo install --locked typst-cli --root src-tauri/.tools
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item src-tauri/.tools/bin/typst.exe src-tauri/binaries/typst-x86_64-pc-windows-msvc.exe

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri app
        run: bun run tauri:build

      - name: Upload Windows installers to draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe

      # Mirror the installers to Cloudflare R2 under
      # `sakoram/<version>/<filename>` so the connected custom domain
      # (https://downloads.gravitide.dev) serves them directly without
      # going through the GitHub Releases UI. R2 is S3-API compatible
      # so the AWS CLI (pre-installed on windows-latest) handles it
      # with a custom endpoint URL.
      #
      # Skipped silently if R2 secrets aren't configured on the repo,
      # so this workflow still works on forks / contributors' branches
      # without coupling them to the gravitide.dev bucket.
      #
      # Spaces in Tauri-produced filenames ("Sakoram Bookkeeping_…")
      # are renamed to dots on upload so the resulting URL doesn't
      # need %20 encoding to look clean.
      - name: Mirror installers to Cloudflare R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    auto
          R2_ACCOUNT_ID:         ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET:             ${{ secrets.R2_BUCKET }}
          TAG:                   ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # Skip cleanly when R2 secrets aren't configured on the repo
          # (forks, contributor branches). Can't reference secrets.*
          # directly in `if:` at step level, so we early-return here.
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${R2_ACCOUNT_ID:-}" ] || [ -z "${R2_BUCKET:-}" ]; then
            echo "R2 credentials not configured — skipping mirror."
            exit 0
          fi

          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          version="${TAG#v}"
          shopt -s nullglob

          uploaded=0
          for f in \
              src-tauri/target/release/bundle/msi/*.msi \
              src-tauri/target/release/bundle/nsis/*-setup.exe; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            # Replace spaces with dots so the URL reads cleanly.
            clean="${base// /.}"
            key="sakoram/$version/$clean"
            echo "→ s3://$R2_BUCKET/$key"
            aws s3 cp "$f" "s3://$R2_BUCKET/$key" \
              --endpoint-url "$endpoint" \
              --content-type "application/octet-stream"
            uploaded=$((uploaded + 1))
          done
          if [ "$uploaded" -eq 0 ]; then
            echo "::warning::No installers found to mirror to R2."
          else
            echo "Mirrored $uploaded file(s) to R2 under sakoram/$version/"
          fi
